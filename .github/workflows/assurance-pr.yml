# Read-only pull-request validation. The publishing assurance workflow has
# elevated contents/OIDC permissions and must NOT be triggered by untrusted PRs.
name: e156 assurance PR gate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance-tests:
    name: Assurance corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies (reviewed wheel digests, no preinstalled bypass)
        run: "python -m pip install --force-reinstall --require-hashes --only-binary=:all: -r requirements-assurance-ci.lock"

      - name: Fetch exact Sentinel source outside the E156 scan root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'Sentinel'
          git clone --quiet https://github.com/mahmood726-cyber/Sentinel.git $root
          if ($LASTEXITCODE -ne 0) { throw "Sentinel download failed; cannot claim corpus coverage" }
          git -C $root checkout --quiet --detach d87211a0c0a43e805b3aba36ec920693928e86b5
          if ($LASTEXITCODE -ne 0) { throw "Pinned Sentinel commit is unavailable" }
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne 'd87211a0c0a43e805b3aba36ec920693928e86b5') {
            throw "Sentinel commit mismatch: $actual"
          }
          "SENTINEL_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check import readiness and package consistency
        shell: pwsh
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Broken Python dependency set" }
          python -c "import os,sys; sys.path.insert(0,os.environ['SENTINEL_ROOT']); import sentinel.core, sentinel.registry.plugin_loader, yaml"
          if ($LASTEXITCODE -ne 0) { throw "Sentinel or PyYAML import failed" }

      - name: Run real E156 assurance tests
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'e156-assurance-junit.xml'
          python -m pytest tests/ -q --junitxml="$report"
          if ($LASTEXITCODE -ne 0) { throw "Assurance test suite failed" }

      - name: Refuse omitted, skipped, or failed test cases
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'e156-assurance-junit.xml'
          python scripts/assurance/require_corpus_results.py $report
          if ($LASTEXITCODE -ne 0) { throw "Assurance coverage gate failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assurance-junit-${{ matrix.os }}
          path: ${{ runner.temp }}/e156-assurance-junit.xml
          if-no-files-found: error

  keyless-oidc-canary:
    name: Keyless OIDC canary (synthetic, no publication)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Sign synthetic blob and refuse altered bytes or wrong issuer
        shell: bash
        run: |
          set -euo pipefail
          echo 'synthetic OIDC preflight; not an assurance badge' > "$RUNNER_TEMP/oidc-preflight.txt"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/oidc-preflight.bundle" "$RUNNER_TEMP/oidc-preflight.txt"
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob --bundle "$RUNNER_TEMP/oidc-preflight.bundle" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$RUNNER_TEMP/oidc-preflight.txt"
          echo 'tampered' >> "$RUNNER_TEMP/oidc-preflight.txt"
          if cosign verify-blob --bundle "$RUNNER_TEMP/oidc-preflight.bundle" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$RUNNER_TEMP/oidc-preflight.txt"; then
            echo 'REFUSED: modified blob incorrectly verified' >&2
            exit 1
          fi
          echo 'synthetic OIDC preflight; not an assurance badge' > "$RUNNER_TEMP/oidc-preflight.txt"
          # A PR identity must never impersonate the production master signer.
          production="https://github.com/$GITHUB_REPOSITORY/.github/workflows/assurance.yml@refs/heads/master"
          if cosign verify-blob --bundle "$RUNNER_TEMP/oidc-preflight.bundle" --certificate-identity "$production" --certificate-oidc-issuer "$issuer" "$RUNNER_TEMP/oidc-preflight.txt"; then
            echo 'REFUSED: PR identity verified as master assurance signer' >&2
            exit 1
          fi
          if cosign verify-blob --bundle "$RUNNER_TEMP/oidc-preflight.bundle" --certificate-identity "$identity" --certificate-oidc-issuer 'https://example.invalid' "$RUNNER_TEMP/oidc-preflight.txt"; then
            echo 'REFUSED: wrong issuer incorrectly verified' >&2
            exit 1
          fi
          echo 'Keyless OIDC signing and negative controls passed; no publication performed.'
