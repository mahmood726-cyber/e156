name: e156 assurance

# Flips on the "external actor" half of the Assurance Standard that can't run
# locally: live DOI resolution (CI has network), Sigstore KEYLESS signing
# (GitHub OIDC — no key to manage), an HMAC verification gate, and a public
# Pages dashboard. The commit-time Sentinel rules stay the local gate; this is
# the publish-time gate.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday 06:00 UTC (re-verifies DOIs with --force)
  push:
    branches: [master]
    paths:
      - "scripts/assurance/**"
      - "scripts/build_assurance_jsons.py"
      - "tests/**"
      - "**/*_REVIEW.html"
      - "e156-submission/**"
      - ".github/workflows/assurance.yml"

permissions:
  contents: write     # commit refreshed doi-cache.json / badges / signatures / dashboard
  id-token: write     # Sigstore keyless signing via GitHub OIDC

concurrency:
  group: assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    runs-on: ubuntu-latest
    env:
      E156_ASSURANCE_HMAC_KEY: ${{ secrets.E156_ASSURANCE_HMAC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install assurance test dependencies (reviewed wheel digests)
        # Reinstall prevents a preinstalled runner package bypassing pip hash checks.
        # PyYAML is needed for Sentinel corpus imports; binary-only refuses unknown builds.
        run: "python -m pip install --force-reinstall --require-hashes --only-binary=:all: -r requirements-assurance-ci.lock"

      - name: Check out Sentinel (mandatory, exact tested commit)
        run: |
          git clone --quiet https://github.com/${{ github.repository_owner }}/Sentinel.git "$RUNNER_TEMP/Sentinel"
          git -C "$RUNNER_TEMP/Sentinel" checkout --quiet --detach d87211a0c0a43e805b3aba36ec920693928e86b5
          test "$(git -C "$RUNNER_TEMP/Sentinel" rev-parse HEAD)" = "d87211a0c0a43e805b3aba36ec920693928e86b5"
          echo "SENTINEL_ROOT=$RUNNER_TEMP/Sentinel" >> "$GITHUB_ENV"

      - name: Run the assurance test suite (hard gate)
        run: python -m pytest tests/ -q --junitxml "$RUNNER_TEMP/e156-assurance-junit.xml"

      - name: Refuse omitted or skipped tests (hard gate)
        if: always()
        run: python scripts/assurance/require_corpus_results.py "$RUNNER_TEMP/e156-assurance-junit.xml"

      - name: Resolve DOIs against doi.org (live)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/assurance/doi_resolver.py --repo . --force
          else
            python scripts/assurance/doi_resolver.py --repo .
          fi

      - name: Sentinel scan for findings (hard gate)
        run: PYTHONPATH="$SENTINEL_ROOT" python -m sentinel scan --repo .

      - name: Regenerate this repo's badge
        run: python scripts/build_assurance_jsons.py --here e156

      - name: HMAC-sign and verify badges (mandatory, non-vacuous)
        run: python scripts/assurance/publish_hmac_badges.py --repo .

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Sigstore keyless-sign badges (public, transparency-logged)
        run: |
          find . -name assurance.json -not -path './.git/*' -print0 |
            while IFS= read -r -d '' f; do
              cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"
            done

      - name: Verify Sigstore badge bundles and workflow identity (hard gate)
        run: python scripts/assurance/verify_sigstore_badges.py --repo .

      - name: Build the public assurance dashboard (served by existing Pages)
        run: python scripts/assurance/build_pages_dashboard.py --repo . --out assurance.html

      - name: Sentinel rescan generated publication artifacts (hard gate)
        # All generated badges, signatures and dashboard must pass Sentinel before push.
        run: PYTHONPATH="$SENTINEL_ROOT" python -m sentinel scan --repo .

      - name: Commit refreshed cache, badges, signatures, dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "assurance: refresh DOI cache, badges, signatures, dashboard [skip ci]"
            git push
          fi
